<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#00D6C9">
<title>Actas de Herramientas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,600..800&family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: barra superior con navegación + contenido en columna ancha; los formatos se ven como hojas blancas impresas */
:root{
  --bg:#F1F5F5; --surface:#FFFFFF; --surface-2:#F7FAFA; --sunken:#EBF1F1;
  --ink:#111719; --ink-2:#45535A; --ink-3:#74838A;
  --line:#DAE3E4; --line-2:#E8EEEE;
  --brand:#00D6C9; --on-brand:#032E2A; --brand-strong:#00796F; --brand-soft:#D8F6F2;
  --ok:#0E6C3A; --ok-bg:#DCF2E5; --warn:#7A4F00; --warn-bg:#FFF0C8; --warn-fill:#E5A019;
  --bad:#A2261A; --bad-bg:#FBE0DA; --nov:#5530A0; --nov-bg:#ECE4FA; --mute:#55626A; --mute-bg:#E7ECED;
  --focus:#00A396;
  --shadow:0 1px 2px rgba(12,24,28,.05),0 6px 18px rgba(12,24,28,.06);
  --shadow-lg:0 24px 64px rgba(12,24,28,.24);
  --f-ui:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --f-display:'Archivo','Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:12px;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1214; --surface:#131B1E; --surface-2:#172124; --sunken:#0F171A;
  --ink:#E5EDEE; --ink-2:#A6B4B9; --ink-3:#7A8A90;
  --line:#25333A; --line-2:#1D292D;
  --brand:#00D6C9; --on-brand:#032E2A; --brand-strong:#3DDFD3; --brand-soft:#0D3431;
  --ok:#62D294; --ok-bg:#11301F; --warn:#F0C25A; --warn-bg:#33270D; --warn-fill:#E0A53A;
  --bad:#FF8A79; --bad-bg:#3A1914; --nov:#BBA2F4; --nov-bg:#292042; --mute:#A1AEB3; --mute-bg:#1E292D;
  --focus:#3DDFD3;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.22);
  --shadow-lg:0 24px 64px rgba(0,0,0,.55);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C1214; --surface:#131B1E; --surface-2:#172124; --sunken:#0F171A;
  --ink:#E5EDEE; --ink-2:#A6B4B9; --ink-3:#7A8A90;
  --line:#25333A; --line-2:#1D292D;
  --brand:#00D6C9; --on-brand:#032E2A; --brand-strong:#3DDFD3; --brand-soft:#0D3431;
  --ok:#62D294; --ok-bg:#11301F; --warn:#F0C25A; --warn-bg:#33270D; --warn-fill:#E0A53A;
  --bad:#FF8A79; --bad-bg:#3A1914; --nov:#BBA2F4; --nov-bg:#292042; --mute:#A1AEB3; --mute-bg:#1E292D;
  --focus:#3DDFD3;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.22);
  --shadow-lg:0 24px 64px rgba(0,0,0,.55);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
body.noscroll{overflow:hidden}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--brand-strong)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.sm{font-size:13px}
.b{font-weight:700}
.center{text-align:center}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.ico{width:18px;height:18px;flex:none}
.ico.lg{width:30px;height:30px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2);border-color:color-mix(in srgb,var(--line) 55%,var(--ink-3))}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:color-mix(in srgb,var(--brand) 86%,#000)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunken);color:var(--ink)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.danger-ghost{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px;border-radius:8px;gap:6px}
.btn.sm .ico{width:16px;height:16px}
.btn.lg{min-height:52px;font-size:16px;border-radius:12px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:9px;border:0;background:transparent;color:var(--ink-2);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--sunken);color:var(--ink)}
.icon-btn.sm{width:30px;height:30px}
.lnk{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.lnk:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.link-btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--brand-strong);font-weight:600;font-size:14px}
.link-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;line-height:1.35}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.nov{background:var(--nov-bg);color:var(--nov)}
.pill.mute{background:var(--mute-bg);color:var(--mute)}
.pill.brand{background:var(--brand-soft);color:var(--brand-strong)}

/* Formularios */
input,select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:9px;min-height:42px;padding:8px 11px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 22%,transparent)}
input[type=checkbox]{width:18px;height:18px;min-height:0;padding:0;margin:0;accent-color:var(--brand-strong);flex:none;box-shadow:none}
.invalid{border-color:var(--bad)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 18%,transparent)!important}
.field{display:grid;gap:6px;min-width:0;align-content:start}
.field>span{font-size:13px;font-weight:600;color:var(--ink-2)}
.field>span em{font-style:normal;font-weight:500;color:var(--ink-3)}
.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.span2{grid-column:span 2}
.out{display:flex;align-items:center;min-height:42px;padding:8px 11px;border-radius:9px;background:var(--sunken);font-weight:700}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--surface);min-height:40px;min-width:0;flex:1 1 240px;color:var(--ink-3)}
.search input{border:0;background:transparent;min-height:38px;padding:0;box-shadow:none!important;color:var(--ink)}
.search:focus-within{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 20%,transparent)}
.search.lg{min-height:52px;border-radius:12px;padding:0 14px}
.search.lg input{min-height:50px;font-size:16px}

/* Barra superior */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--surface)}
body.firma-mode::before{background:var(--brand)}
.topbar-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:16px;padding-block:10px;padding-left:var(--gl);padding-right:var(--gr)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.brand img{width:36px;height:36px;border-radius:8px;flex:none}
.brand b{display:block;font:750 16px/1.1 var(--f-display);font-stretch:112%;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;color:var(--ink-3);font-size:11.5px;white-space:nowrap}
.nav{display:flex;gap:2px;margin-left:8px;overflow-x:auto;scrollbar-width:none;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:8px 13px;border-radius:999px;text-decoration:none;color:var(--ink-2);font-weight:600;font-size:14px;white-space:nowrap}
.nav a:hover{background:var(--sunken);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--surface)}
.user-chip{margin-left:auto;display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;text-align:left;min-width:0}
.user-chip:hover{background:var(--surface-2)}
.user-chip b{display:block;font-size:13px;line-height:1.2;white-space:nowrap}
.user-chip small{display:block;font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font:800 11.5px/1 var(--f-display);font-stretch:110%;flex:none;letter-spacing:.02em}
.avatar.lg{width:46px;height:46px;font-size:15px}
.avatar.mute{background:var(--sunken);color:var(--ink-2)}
@media (max-width:820px){
  .topbar-in{flex-wrap:wrap;row-gap:8px}
  .nav{order:3;width:100%;margin-left:-6px}
  .user-chip .uc-t small{display:none}
}
@media (max-width:420px){.brand small{display:none}.user-chip .uc-t{display:none}.user-chip{padding:4px}}

.banner{background:var(--ink);color:var(--surface)}
.banner-in{max-width:1280px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:9px;padding-left:var(--gl);padding-right:var(--gr);font-size:14px}
.banner-in .btn{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}

/* Contenido */
.main{max-width:1280px;margin:0 auto;padding-block:24px 40px;padding-left:var(--gl);padding-right:var(--gr);display:grid;gap:18px;min-width:0}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.page-head h1{font:800 clamp(25px,3.1vw,33px)/1.08 var(--f-display);font-stretch:114%;letter-spacing:-.02em;margin-top:5px}
.head-actions{display:flex;flex-wrap:wrap;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:16px 16px 12px}
.card-head h2,.sc-head h2,.cfg-head h2{font:750 17px/1.2 var(--f-display);font-stretch:108%}
.filters{display:flex;flex-wrap:wrap;gap:8px;min-width:0;flex:1 1 420px;justify-content:flex-end}
.filters select{width:auto;min-height:40px;flex:0 1 auto}
.foot{max-width:1280px;margin:0 auto;padding-bottom:28px;padding-left:var(--gl);padding-right:var(--gr);color:var(--ink-3);font-size:12.5px;display:flex;gap:8px;align-items:center}
.foot i{width:8px;height:8px;border-radius:50%;background:var(--warn-fill);flex:none}
.note{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:10px;font-size:14px;line-height:1.45}
.note .ico{margin-top:1px}
.note.info{background:var(--brand-soft);color:var(--ink)}
.note.info .ico{color:var(--brand-strong)}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.nov{background:var(--nov-bg);color:var(--ink);display:grid;gap:4px}
.note.nov b{color:var(--nov)}
.empty{padding:40px 16px;text-align:center;color:var(--ink-2)}
.empty-sm{padding:14px 0 2px;color:var(--ink-2);font-size:14px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{appearance:none;text-align:left;font:inherit;color:inherit;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 13px;display:grid;gap:5px;align-content:start;box-shadow:var(--shadow);min-width:0}
.kpi:hover{border-color:color-mix(in srgb,var(--line) 45%,var(--ink-3))}
.kpi[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.k-top{display:flex;align-items:flex-start;gap:8px;font-size:13px;font-weight:650;color:var(--ink-2);line-height:1.35}
.k-dot{width:8px;height:8px;border-radius:50%;background:var(--kc);flex:none;margin-top:5px}
.k-n{font:800 36px/1 var(--f-display);font-stretch:118%;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.k-h{font-size:12px;color:var(--ink-3);line-height:1.35}
.kpi.warn{--kc:var(--warn-fill)} .kpi.bad{--kc:var(--bad)} .kpi.ok{--kc:var(--ok)} .kpi.nov{--kc:var(--nov)} .kpi.brand{--kc:var(--brand)}
.kpi.bad.has .k-n{color:var(--bad)} .kpi.nov.has .k-n{color:var(--nov)}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis .kpi:last-child{grid-column:span 2}.k-n{font-size:30px}.head-actions{width:100%}.head-actions .btn{flex:1 1 auto}.head-actions .btn.primary{order:-1;flex-basis:100%}}

.cols{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px;align-items:start}
@media (max-width:1100px){.cols{grid-template-columns:minmax(0,1fr)}}
.side{display:grid;gap:18px;min-width:0}
.side-card{padding:16px}
.sc-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.side-card select{display:inline;width:auto;min-height:0;padding:1px 4px;border-radius:6px;font-weight:700}
.mini-list{list-style:none;margin:10px 0 0;padding:0;display:grid}
.mini-list li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line-2)}
.ml-t{min-width:0}
.ml-t b{display:block;font-weight:650;font-size:14px;line-height:1.3}
.ml-t small{display:block;color:var(--ink-3);font-size:12.5px;line-height:1.35}
.more{display:inline-block;margin-top:8px;font-size:13px;font-weight:600}

/* Segmento de estados */
.seg{display:flex;gap:6px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:650;color:var(--ink-2);cursor:pointer;display:inline-flex;gap:7px;white-space:nowrap}
.seg button span{color:var(--ink-3);font-variant-numeric:tabular-nums}
.seg button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.seg button[aria-selected="true"] span{color:color-mix(in srgb,var(--surface) 65%,transparent)}

/* Lista de actas */
.arows{border-top:1px solid var(--line)}
.arow{appearance:none;font:inherit;color:inherit;text-align:left;background:none;border:0;border-bottom:1px solid var(--line-2);display:grid;grid-template-columns:104px minmax(0,1.45fr) minmax(0,1.15fr) 112px 104px 142px;gap:14px;align-items:center;width:100%;padding:12px 16px;cursor:pointer}
.arow:hover{background:var(--surface-2)}
.arow:last-child{border-bottom:0}
.arow:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.arow b{font-weight:650}
.arow small{display:block;color:var(--ink-3);font-size:12.5px;line-height:1.35}
.arow>span{min-width:0}
.c-id b{font-family:var(--f-mono);font-size:13px;font-weight:600}
.c-who b{display:block;line-height:1.3;overflow-wrap:anywhere}
.c-where{font-size:14px}
.c-val{text-align:right;font-variant-numeric:tabular-nums;font-weight:650;font-size:14px}
.c-st{display:grid;justify-items:start;gap:3px}
.kitbar{display:grid;gap:5px;font-size:12.5px;color:var(--ink-2)}
.kitbar i{display:block;height:6px;border-radius:99px;background:var(--sunken);overflow:hidden}
.kitbar i b{display:block;height:100%;background:var(--brand);border-radius:99px}
.kitbar.falta i b{background:var(--warn-fill)}
@media (max-width:880px){
  .arow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"who st" "where val" "id kit";row-gap:8px;column-gap:12px}
  .c-who{grid-area:who}.c-st{grid-area:st;justify-items:end;text-align:right}.c-where{grid-area:where}.c-val{grid-area:val}.c-id{grid-area:id}.c-kit{grid-area:kit;width:120px}
}

/* Cajón de detalle */
.drawer{position:fixed;inset:0;z-index:50}
.dr-back{position:absolute;inset:0;background:rgba(8,16,18,.42);opacity:0;transition:opacity .2s}
.drawer.open .dr-back{opacity:1}
.dr-panel{position:absolute;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--surface);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease}
.drawer.open .dr-panel{transform:none}
.dr-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 14px;padding-top:max(18px,env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
.dr-head h2{font:800 22px/1.15 var(--f-display);font-stretch:110%;margin:4px 0 4px}
.dr-body{flex:1;overflow:auto;padding:18px 20px 22px;display:grid;gap:20px;align-content:start}
.dr-foot{display:flex;flex-wrap:wrap;gap:8px;padding:14px 20px;padding-bottom:max(14px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface-2)}
.dr-sec{display:grid;gap:10px}
.dr-sec h3{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.dr-state{display:flex;align-items:center;gap:14px;padding:14px;border-radius:12px}
.dr-state p{font-size:14px;line-height:1.45}
.dr-state.ok{background:var(--ok-bg);color:var(--ok)} .dr-state.warn{background:var(--warn-bg);color:var(--warn)} .dr-state.bad{background:var(--bad-bg);color:var(--bad)} .dr-state.nov{background:var(--nov-bg);color:var(--nov)} .dr-state.mute{background:var(--mute-bg);color:var(--mute)}
.dr-state p{color:var(--ink)}
.stamp{display:inline-flex;align-items:center;border:2px solid currentColor;border-radius:7px;padding:6px 10px;font:800 12px/1 var(--f-display);font-stretch:120%;letter-spacing:.09em;text-transform:uppercase;transform:rotate(-3deg);white-space:nowrap;flex:none}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px;margin:0}
.dl dt{font-size:12px;color:var(--ink-3);font-weight:600}
.dl dd{margin:2px 0 0;font-weight:600;font-size:14px;overflow-wrap:anywhere}
.txt-warn{color:var(--warn)}
.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.chips li{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:4px 9px;font-size:13px;font-weight:600}
.it-list{list-style:none;margin:8px 0 0;padding:0;display:grid}

.f-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--brand);color:var(--on-brand)}
.f-top-in{max-width:660px;margin:0 auto;display:flex;align-items:center;gap:11px;padding-block:10px;padding-left:var(--gl);padding-right:var(--gr)}
.f-top img{width:38px;height:38px;border-radius:9px;box-shadow:0 0 0 2px rgba(3,46,42,.12)}
.f-top b{display:block;font:800 16.5px/1.1 var(--f-display);font-stretch:112%}
.f-top small{display:block;font-size:12px;opacity:.8;font-weight:600}
.f-demo{background:var(--ink);color:var(--surface);font-size:13px}
.f-demo>div{max-width:660px;margin:0 auto;display:flex;justify-content:space-between;gap:10px;padding-block:7px;padding-left:var(--gl);padding-right:var(--gr)}
.f-demo a{color:var(--brand);font-weight:700}
.f-main{max-width:660px;margin:0 auto;padding-block:18px 28px;padding-left:var(--gl);padding-right:var(--gr);display:grid;gap:14px}
.f-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 18px;display:grid;gap:13px;box-shadow:var(--shadow);min-width:0}
.f-card h1{font:800 23px/1.15 var(--f-display);font-stretch:110%;letter-spacing:-.01em}
.f-card h2{font:750 16px/1.25 var(--f-display);font-stretch:106%}
.f-step{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-strong)}
.f-form{display:grid;gap:12px}
.f-form input{min-height:54px;font-size:20px;letter-spacing:.06em;font-family:var(--f-mono)}
.f-err{color:var(--bad);font-weight:600;font-size:14px}
.f-dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;margin:0;padding:12px 14px;background:var(--surface-2);border-radius:12px;border:1px solid var(--line-2)}
.f-dl dt{font-size:12px;color:var(--ink-3);font-weight:600}
.f-dl dd{margin:2px 0 0;font-weight:650;font-size:14px;overflow-wrap:anywhere}
.f-dl.one{grid-template-columns:minmax(0,1fr)}
.f-list-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}
.f-items{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.f-items li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 13px;border-bottom:1px solid var(--line-2);font-size:14.5px;font-weight:600}
.f-items li:last-child{border-bottom:0}
.f-items li span{min-width:0}
.f-items li small{display:block;font-weight:500;color:var(--ink-3);font-size:12.5px}
.f-items li b{min-width:30px;height:30px;border-radius:8px;background:var(--brand-soft);color:var(--brand-strong);display:grid;place-items:center;font-weight:800;flex:none}
.f-items.falta li b{background:var(--warn-bg);color:var(--warn)}
.f-aut{display:grid;gap:12px;font-size:14.5px;line-height:1.55}
.f-aut p{text-align:left}
.f-check{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:12px;background:var(--brand-soft);cursor:pointer;font-weight:650;line-height:1.4}
.f-check input{width:22px;height:22px;margin-top:1px}
.f-small{font-size:12.5px;color:var(--ink-3);line-height:1.45}
.pad-box{position:relative;height:210px;border:1.5px dashed #9AA9AE;border-radius:14px;background:#fff;overflow:hidden}
.pad-box.sm{height:170px}
.pad-box canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;display:block}
.pad-line{position:absolute;left:20px;right:20px;bottom:48px;border-bottom:1.5px solid #CBD5D8;pointer-events:none}
.pad-hint{position:absolute;left:20px;bottom:24px;font-size:12px;color:#8A979C;pointer-events:none;font-weight:600}
.pad-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:32px}
.f-nov{background:transparent;box-shadow:none;border-style:dashed}
.f-done{justify-items:center;text-align:center;padding-block:30px}
.f-ok{width:72px;height:72px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center}
.f-ok .ico{width:38px;height:38px;stroke-width:2.4}
.f-code{display:grid;gap:4px;padding:12px 18px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.f-code span{font-size:12px;color:var(--ink-3);font-weight:600}
.f-code b{font-size:22px;letter-spacing:.06em}
.f-msg{justify-items:center;text-align:center;padding-block:34px}
.f-msg .f-ok{background:var(--sunken);color:var(--ink-2)}
.f-foot{text-align:center;color:var(--ink-3);font-size:12px;padding:0 16px 28px}
</style>
</head>

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[_\s]+/g,' ').trim();
const digits=s=>String(s??'').replace(/\D+/g,'');
const fmtCOP=n=>'$ '+Math.round(Number(n)||0).toLocaleString('es-CO');
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const dfDate=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'});
const dfTime=new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
const hoyISO=()=>dfDate.format(new Date());
const bogDate=ts=>dfDate.format(new Date(ts));
const fDate=d=>{ if(!d) return '—'; const [y,m,dd]=String(d).slice(0,10).split('-'); return `${dd}/${m}/${y}`; };
const fTs=ts=>ts?`${fDate(bogDate(ts))} ${dfTime.format(new Date(ts))}`:'—';
const fTsCorto=ts=>ts?`${fDate(bogDate(ts))} · ${dfTime.format(new Date(ts)).slice(0,5)}`:'—';
const fechaLarga=d=>{ if(!d) return ''; const [y,m,dd]=String(d).slice(0,10).split('-').map(Number); return `${dd} de ${MESES[m-1]} de ${y}`; };
const dayNum=d=>{ const [y,m,dd]=String(d).split('-').map(Number); return Math.round(Date.UTC(y,m-1,dd)/864e5); };
const diasDesde=x=>{ if(!x) return null; const d=String(x).length===10?String(x):bogDate(x); return dayNum(hoyISO())-dayNum(d); };
const addDays=(d,n)=>{ const [y,m,dd]=d.split('-').map(Number); return new Date(Date.UTC(y,m-1,dd)+n*864e5).toISOString().slice(0,10); };
const hace=n=>n==null?'':n<=0?'hoy':n===1?'ayer':`hace ${n} días`;
const MENORES=new Set(['de','del','la','las','los','y']);
const titleCase=s=>String(s??'').toLowerCase().split(/\s+/).filter(Boolean).map((w,i)=>(i>0&&MENORES.has(w))?w:w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
const slug=s=>norm(s).replace(/[^A-Z0-9]+/g,'-').replace(/^-+|-+$/g,'');
const iniciales=n=>{ const t=String(n||'').trim().split(/\s+/); const a=t.length>=3?t[2]:t[1]||''; return ((a[0]||'')+(t[0]?.[0]||'')).toUpperCase()||'?'; };
const llenar=(tpl,vars)=>String(tpl||'').replace(/\{\{\s*(\w+)\s*\}\}/g,(m,k)=>vars[k]!=null?vars[k]:m);
function tokenAleatorio(n=22){ const a='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789'; const b=new Uint8Array(n); crypto.getRandomValues(b); let o=''; for(const x of b) o+=a[x%a.length]; return o; }

function numeroALetras(num){
  const n=Math.round(Math.abs(Number(num)||0));
  if(n===0) return 'CERO PESOS M/CTE';
  const U=['','UNO','DOS','TRES','CUATRO','CINCO','SEIS','SIETE','OCHO','NUEVE','DIEZ','ONCE','DOCE','TRECE','CATORCE','QUINCE','DIECISÉIS','DIECISIETE','DIECIOCHO','DIECINUEVE','VEINTE','VEINTIUNO','VEINTIDÓS','VEINTITRÉS','VEINTICUATRO','VEINTICINCO','VEINTISÉIS','VEINTISIETE','VEINTIOCHO','VEINTINUEVE'];
  const D=['','','','TREINTA','CUARENTA','CINCUENTA','SESENTA','SETENTA','OCHENTA','NOVENTA'];
  const C=['','CIENTO','DOSCIENTOS','TRESCIENTOS','CUATROCIENTOS','QUINIENTOS','SEISCIENTOS','SETECIENTOS','OCHOCIENTOS','NOVECIENTOS'];
  const tres=x=>{ if(!x) return ''; if(x===100) return 'CIEN'; const c=Math.floor(x/100), r=x%100, p=[]; if(c) p.push(C[c]); if(r) p.push(r<30?U[r]:D[Math.floor(r/10)]+(r%10?' Y '+U[r%10]:'')); return p.join(' '); };
  const apoc=s=>s.replace(/VEINTIUNO$/,'VEINTIÚN').replace(/UNO$/,'UN');
  const mm=Math.floor(n/1e6)%1000, k=Math.floor(n/1e3)%1000, r=n%1000, bb=Math.floor(n/1e9);
  const p=[];
  if(bb) p.push(bb===1?'MIL':apoc(tres(bb))+' MIL');
  if(mm||bb){ if(mm===1&&!bb) p.push('UN MILLÓN'); else if(mm) p.push(apoc(tres(mm))+' MILLONES'); else p.push('MILLONES'); }
  if(k) p.push(k===1?'MIL':apoc(tres(k))+' MIL');
  if(r) p.push(tres(r));
  return apoc(p.join(' '))+(n%1e6===0?' DE PESOS M/CTE':' PESOS M/CTE');
}

function fitImg(doc,data,x,y,w,h,align){ if(!data) return; try{ const p=doc.getImageProperties(data); const r=Math.min(w/p.width,h/p.height); const iw=p.width*r, ih=p.height*r; const ix=align==='left'?x:x+(w-iw)/2; doc.addImage(data,imgFmt(data),ix,y+(h-ih)/2,iw,ih,undefined,'FAST'); }catch(e){ console.warn(e); } }
function marcaAgua(doc,txt){ const W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight(); doc.saveGraphicsState(); doc.setGState(new doc.GState({opacity:0.1})); doc.setFont('helvetica','bold'); doc.setFontSize(52); doc.setTextColor(0,0,0); const tw=doc.getTextWidth(txt), r=35*Math.PI/180; doc.text(txt,W/2-tw/2*Math.cos(r),H/2+tw/2*Math.sin(r),{angle:35}); doc.restoreGraphicsState(); doc.setTextColor(0,0,0); }

function pieDoc(doc,a){ const W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight(); doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(95); const txt=a.firma?`Firmado electrónicamente por ${a.persona.nombre} (C.C. ${a.persona.cedula}) el ${fTs(a.firma.fecha)}, hora de Colombia. Código de verificación: ${a.firma.codigo}. Ver certificado de firma al final del documento.`:(a.enviada?'Documento pendiente de firma del funcionario.':'Borrador: documento aún no enviado para firma.'); doc.text(doc.splitTextToSize(txt,W-60),14,H-11); doc.setTextColor(0); }
function parrafo(doc,runs,x,y,maxW,lh,just){
  const units=[]; let cur=null;
  for(const [txt,b] of runs){ for(const part of String(txt).split(/( +)/)){ if(part==='') continue; if(/^ +$/.test(part)){ if(cur){ units.push(cur); cur=null; } continue; } if(!cur) cur={segs:[]}; cur.segs.push({t:part,b:!!b}); } }
  if(cur) units.push(cur);
  const ancho=u=>u.segs.reduce((s,g)=>{ doc.setFont('helvetica',g.b?'bold':'normal'); return s+doc.getTextWidth(g.t); },0);
  doc.setFont('helvetica','normal'); const sp=doc.getTextWidth(' ');
  const lines=[]; let line=[], lw=0;
  for(const u of units){ u.w=ancho(u); const add=line.length?sp+u.w:u.w; if(lw+add>maxW&&line.length){ lines.push({u:line,w:lw}); line=[u]; lw=u.w; } else { line.push(u); lw+=add; } }
  if(line.length) lines.push({u:line,w:lw,last:true});
  for(const L of lines){ let gap=sp; if(just&&!L.last&&L.u.length>1) gap=sp+(maxW-L.w)/(L.u.length-1); let cx=x; for(const u of L.u){ for(const g of u.segs){ doc.setFont('helvetica',g.b?'bold':'normal'); doc.text(g.t,cx,y); cx+=doc.getTextWidth(g.t); } cx+=gap; } y+=lh; }
  doc.setFont('helvetica','normal'); return y;
}

const celdaTxt=v=>{ if(v==null) return ''; if(typeof v==='number') return Number.isInteger(v)?String(v):String(Math.trunc(v)); return String(v).trim(); };
function celdaFecha(v){
  if(v==null||v==='') return '';
  if(v instanceof Date&&!isNaN(v)) return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;
  if(typeof v==='number'&&v>20000&&v<80000) return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);
  const s=String(v).trim(); let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/))) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return '';
}
function celdaCel(v){ let d=digits(celdaTxt(v)); if(d.length>10) d=d.slice(-10); return d.length>=7?d:''; }

async function procesar290(file){

  if(idx.cedula==null||idx.nombre==null) return toast('Faltan las columnas CEDULA y NOMBRE DEL EMPLEADO.','bad');

  let total=0,act=0,ret=0,nuevos=0,actualizados=0; const clientes=new Set(), porCed=new Map();
  for(const r of filas.slice(hIdx+1)){
    const ced=digits(celdaTxt(v(r,'cedula'))), nom=celdaTxt(v(r,'nombre')).replace(/\s+/g,' ').toUpperCase();

    const est=estadoDe(v(r,'estado'),fr);
    const p={codigo:cod,cedula:ced,lugarExp:celdaTxt(v(r,'lugarExp')),nombre:nom,cargo:celdaTxt(v(r,'cargo')).toUpperCase(),cliente:celdaTxt(v(r,'cliente')),codCliente:celdaTxt(v(r,'codCliente')),empleador:celdaTxt(v(r,'empleador'))||S.config.empleador,centroOp:celdaTxt(v(r,'centroOp')).toUpperCase(),regional:celdaTxt(v(r,'regional')).toUpperCase(),agencia:celdaTxt(v(r,'agencia')).toUpperCase(),email:celdaTxt(v(r,'email')).toLowerCase(),celular:celdaCel(v(r,'celular'))||celdaCel(v(r,'telefono')),fechaIngreso:fi,fechaRetiro:fr,estado:est,fuente:'290'};

  <div class="m-body"><dl class="dl"><div><dt>Cliente</dt><dd>${esc([...clientes].join(', ')||'—')}</dd></div><div><dt>Registros</dt><dd>${total}</dd></div><div><dt>Activos</dt><dd>${act}</dd></div><div><dt>Retirados</dt><dd>${ret}</dd></div><div><dt>Nuevos · actualizados</dt><dd>${nuevos} · ${actualizados}</dd></div><div><dt>Reingresos</dt><dd>${reingresos}</dd></div></dl>
  <div class="note info">${ico('shield')}<p>Se tomaron ${usadas.size} columnas y se descartaron ${descartadas}, entre ellas salario, cuenta bancaria, EPS y RH. Esos datos no quedan guardados.</p></div></div>
  <div class="m-foot"><button class="btn primary" type="button" data-act="cerrar-modal">Listo</button></div>`,{ancho:'sm'});
}

class Pad{
  constructor(canvas,onChange){ this.c=canvas; this.g=canvas.getContext('2d'); this.on=onChange||(()=>{}); this.s=[]; this.cur=null; this.resize();
    canvas.addEventListener('pointerdown',e=>this.down(e)); canvas.addEventListener('pointermove',e=>this.move(e));
    ['pointerup','pointercancel'].forEach(t=>canvas.addEventListener(t,()=>this.up()));
    if(window.ResizeObserver){ this.ro=new ResizeObserver(()=>this.resize()); this.ro.observe(canvas); } }
  pos(e){ const r=this.c.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
  down(e){ e.preventDefault(); try{ this.c.setPointerCapture(e.pointerId); }catch(_){ } this.cur=[this.pos(e)]; this.s.push(this.cur); this.draw(); }
  move(e){ if(!this.cur) return; e.preventDefault(); const p=this.pos(e), l=this.cur[this.cur.length-1]; if(Math.hypot(p.x-l.x,p.y-l.y)<1.2) return; this.cur.push(p); this.draw(); }
  up(){ if(!this.cur) return; this.cur=null; this.on(this.has()); }
  has(){ return this.s.length>0; }
  clear(){ this.s=[]; this.cur=null; this.draw(); this.on(false); }
  resize(){ const r=this.c.getBoundingClientRect(); if(!r.width) return; const dpr=Math.max(1,window.devicePixelRatio||1); this.c.width=Math.round(r.width*dpr); this.c.height=Math.round(r.height*dpr); this.g.setTransform(dpr,0,0,dpr,0,0); this.draw(); }
  estilo(g){ g.lineCap='round'; g.lineJoin='round'; g.strokeStyle='#0B1F3A'; g.fillStyle='#0B1F3A'; g.lineWidth=2.6; }
  trazo(g,s){ if(s.length===1){ g.beginPath(); g.arc(s[0].x,s[0].y,1.5,0,Math.PI*2); g.fill(); return; } g.beginPath(); g.moveTo(s[0].x,s[0].y); for(let i=1;i<s.length-1;i++){ g.quadraticCurveTo(s[i].x,s[i].y,(s[i].x+s[i+1].x)/2,(s[i].y+s[i+1].y)/2); } const L=s[s.length-1]; g.lineTo(L.x,L.y); g.stroke(); }
  draw(){ const g=this.g; g.save(); g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,this.c.width,this.c.height); g.restore(); this.estilo(g); for(const s of this.s) this.trazo(g,s); }
  png(){ if(!this.has()) return null; let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; for(const s of this.s) for(const p of s){ x0=Math.min(x0,p.x); y0=Math.min(y0,p.y); x1=Math.max(x1,p.x); y1=Math.max(y1,p.y); } const pad=8; x0-=pad; y0-=pad; x1+=pad; y1+=pad; const w=Math.max(20,x1-x0), h=Math.max(20,y1-y0); const k=Math.min(3,640/w,240/h); const out=document.createElement('canvas'); out.width=Math.max(1,Math.round(w*k)); out.height=Math.max(1,Math.round(h*k)); const g=out.getContext('2d'); g.setTransform(k,0,0,k,-x0*k,-y0*k); this.estilo(g); for(const s of this.s) this.trazo(g,s); return out.toDataURL('image/png'); }
  destroy(){ if(this.ro) this.ro.disconnect(); }
}

function fRevisar(a){
  const t=totales(a.items), ent=a.items.filter(i=>i.fis>0), fal=a.items.filter(i=>i.fis<i.req), d=a.descuento, emp=a.persona.empleador||S.config.empleador;
  return `<section class="f-card"><p class="f-step">Paso 2 de 3 · Revisa</p><h1>Acta de entrega de herramientas</h1>
    <dl class="f-dl"><div><dt>Fecha</dt><dd>${fDate(a.fecha)}</dd></div><div><dt>Ciudad y tienda</dt><dd>${esc(ciudadTienda(a))}</dd></div><div><dt>Nombre</dt><dd>${esc(a.persona.nombre)}</dd></div><div><dt>Cédula</dt><dd class="mono">${esc(a.persona.cedula)}</dd></div><div><dt>Entregó</dt><dd>${esc(titleCase(a.lider.nombre))}${a.lider.cargo?` · ${esc(a.lider.cargo)}`:''}</dd></div><div><dt>Cliente</dt><dd>${esc(a.persona.cliente)}</dd></div></dl>
    <div class="f-list-h"><h2>Herramientas que recibes</h2><span class="pill brand">${t.fis}</span></div>
    <ul class="f-items">${ent.map(i=>`<li><span>${esc(i.nombre)}${i.marca?`<small>Marca: ${esc(i.marca)}</small>`:''}${i.obs?`<small>${esc(i.obs)}</small>`:''}</span><b class="num">${i.fis}</b></li>`).join('')}</ul>
    ${fal.length?`<div class="f-list-h"><h2>Pendientes por entregar</h2><span class="pill warn">${t.falt}</span></div><ul class="f-items falta">${fal.map(i=>`<li><span>${esc(i.nombre)}</span><b class="num">${i.req-i.fis}</b></li>`).join('')}</ul><p class="f-small">Estas herramientas hacen parte del kit pero no se entregaron hoy. No quedan a tu cargo hasta que las recibas.</p>`:''}
    <button class="link-btn" type="button" data-act="f-ver" data-t="entrega">${ico('file')}Ver el formato completo</button>
    <label class="f-check"><input type="checkbox" id="f-ent" ${FS.ent?'checked':''}><span>Confirmo que recibí las herramientas en las cantidades indicadas.</span></label></section>
  <section class="f-card"><h1>Autorización de descuento</h1>
    <div class="f-aut"><p>Yo <b>${esc(a.persona.nombre)}</b> autorizo a <b>${esc(emp)}</b>, a deducir de mi salario, vacaciones, prima, cesantías, intereses de cesantías, incapacidades y/o prestaciones sociales, la suma de: <b>${fmtCOP(d.valorTotal)}</b> (${esc(numeroALetras(d.valorTotal))}).</p><p>En caso de retirarme de <b>${esc(emp)}</b>; por cualquier causa, este valor se convierte en exigible inmediatamente y en tal evento, expresamente autorizo a mi empleador, para deducir o retener la suma, indemnizaciones y prestaciones que deban liquidarme en el momento del retiro de conformidad con lo dispuesto para tal evento en los artículos 59, numeral 1. y 149 Inciso 1., del Código Sustantivo del Trabajo.</p>
    <dl class="f-dl one"><div><dt>Valor total del descuento</dt><dd>${fmtCOP(d.valorTotal)}</dd></div><div><dt>Concepto del descuento</dt><dd>${esc(d.concepto)}</dd></div><div><dt>Número de cuotas a descontar</dt><dd>${esc(d.cuotas)}</dd></div><div><dt>Valor de las cuotas a descontar</dt><dd>${fmtCOP(d.valorCuota)}</dd></div><div><dt>Períodos de descuento</dt><dd>${esc(d.periodos)}</dd></div><div><dt>A partir de</dt><dd>${esc(d.aPartirDe)}</dd></div></dl></div>
    <button class="link-btn" type="button" data-act="f-ver" data-t="aut">${ico('file')}Ver el formato completo</button>
    <label class="f-check"><input type="checkbox" id="f-des" ${FS.des?'checked':''}><span>Leí y acepto la autorización de descuento.</span></label></section>
  <section class="f-card"><p class="f-step">Paso 3 de 3 · Firma</p><h1>Firma con tu dedo</h1>
    <div class="pad-box"><canvas id="pad" aria-label="Espacio para firmar"></canvas><span class="pad-line"></span><span class="pad-hint">Firma aquí</span></div>
    <div class="pad-actions"><span class="f-small" id="f-falta"></span><button class="btn sm ghost" type="button" data-act="f-borrar">Borrar</button></div>
    <button class="btn primary block lg" type="button" id="f-firmar" disabled>Firmar las dos actas</button>
    <p class="f-small">Al firmar quedan registrados la fecha, la hora y el dispositivo, y se genera un código para verificar que el documento no cambie.</p></section>
  <section class="f-card f-nov"><h2>¿Algo no coincide con lo que recibiste?</h2><p class="muted">No firmes. Cuéntanos qué falta o qué está diferente y tu líder te enviará el acta corregida.</p><button class="btn block" type="button" data-act="f-novedad">Reportar una novedad</button></section>`;
}
function fListo(a){ return `<section class="f-card f-done"><div class="f-ok">${ico('check')}</div><h1>Firmaste tus actas</h1><p class="muted">${fTs(a.firma.fecha)} · ${esc(a.firma.dispositivo)}</p><div class="f-code"><span>Código de verificación</span><b class="mono">${esc(a.firma.codigo)}</b></div><button class="btn primary block lg" type="button" data-act="f-pdf">${ico('download')}Descargar mi copia en PDF</button><p class="f-small">Guarda este código: sirve para comprobar que el documento no cambió después de tu firma.</p></section>`; }
async function firmarActas(){
  const b=$('#f-firmar'); if(!(FS.ent&&FS.des&&FS.pad&&FS.pad.has())) return;
  b.disabled=true; b.textContent='Firmando…';
  const png=FS.pad.png(), fecha=new Date().toISOString(), disp=dispositivo();
  const fresh=cargar(); if(fresh) S=fresh;
  const a=actaPorToken(FS.tok); if(!a||a.estado!=='pendiente'){ pintarFirma(); return; }
  a.firma={png,fecha,dispositivo:disp,acepta:{entrega:true,descuento:true}};
  a.firma.hash=await sha256(canonActa(a)); a.firma.codigo=codigoVerif(a.firma.hash);
  if(!a.validada) a.validada=fecha;
  a.estado='firmada';
  if(!guardar()){ a.firma=null; a.estado='pendiente'; b.disabled=false; b.textContent='Firmar las dos actas'; return; }
  pintarFirma(); window.scrollTo({top:0,behavior:'smooth'});
}
function modalNovedad(){
  abrirModal(`<div class="m-head"><div><h2>Reportar una novedad</h2></div><button class="icon-btn" type="button" data-act="cerrar-modal" aria-label="Cerrar">${ico('x')}</button></div><div class="m-body"><p class="muted">Cuéntanos qué herramienta falta, sobra o llegó en mal estado. Tu líder recibirá el mensaje.</p><label class="field"><span>Qué no coincide</span><textarea id="nv-t" rows="4" placeholder="Ejemplo: no recibí la copa 14" autofocus></textarea></label></div><div class="m-foot"><button class="btn" type="button" data-act="cerrar-modal">Cancelar</button><button class="btn primary" type="button" id="nv-ok">Enviar novedad</button></div>`,{ancho:'sm'});
  $('#nv-ok').onclick=()=>{ const t=$('#nv-t').value.trim(); if(t.length<4){ $('#nv-t').classList.add('invalid'); $('#nv-t').focus(); return; } const a=actaPorToken(FS.tok); if(a) actualizarActa(a.id,x=>{ x.estado='novedad'; x.novedad={texto:t,fecha:new Date().toISOString()}; if(!x.validada) x.validada=new Date().toISOString(); }); cerrarModal(); pintarFirma(); window.scrollTo(0,0); };
}

/* ================= Clics ================= */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act, id=el.dataset.id;
  switch(act){
    case 'cerrar-modal': e.preventDefault(); cerrarModal(); break;
    case 'cerrar-drawer': cerrarDrawer(); break;
    case 'nueva': W=null; irA('nueva'); break;
    case 'perfil': modalPerfil(); break;
    case 'ir-cargar': irA('funcionarios'); setTimeout(()=>{ const f=$('#f290'); if(f) f.click(); },60); break;
    case 'excel': exportarExcel(); break;
    case 'zip': descargarZip(); break;
    case 'kpi': { const f=el.dataset.f; if(f==='sinacta'){ $('#sin-acta')?.scrollIntoView({behavior:'smooth',block:'start'}); break; } PF.estado=PF.estado===f?'todas':f; vistaPanel(); $('#pf-list')?.closest('.card').scrollIntoView({behavior:'smooth',block:'start'}); break; }
    case 'pf-estado': PF.estado=el.dataset.f; vistaPanel(); break;
    case 'ver-sin-acta': e.preventDefault(); FF.acta='sin'; FF.estado='activo'; irA('funcionarios'); break;
    case 'abrir-acta': abrirDrawer(id); break;
    case 'crear-para': nuevaPara(el.dataset.cod); break;
    case 'copiar': copiar(el.dataset.text); break;
    case 'recordar': { const a=S.actas[id]; if(a){ a.recordatorios=a.recordatorios||[]; a.recordatorios.push({fecha:new Date().toISOString(),canal:el.dataset.canal}); guardar(); setTimeout(()=>{ pintarDrawer(); refrescar(); },50); toast(`Recordatorio registrado (${el.dataset.canal})`); } break; }
    case 'docs': modalDocs(S.actas[id]); break;
    case 'doc-tab': M.docTab=el.dataset.t; if(M.pintarDoc) M.pintarDoc(); break;
    case 'doc-pdf': if(M.doc) descargarPDF(M.doc); break;
    case 'pdf': descargarPDF(S.actas[id]); break;
    case 'anular': modalAnular(S.actas[id]); break;
    case 'corregir': corregirActa(S.actas[id]); break;
    case 'w-elegir': if(el.getAttribute('aria-disabled')==='true'){ toast('Esta persona está retirada en la 290.','bad'); break; } seleccionarPersona(el.dataset.cod); vistaNueva(); setTimeout(()=>$('#w-ent')?.scrollIntoView({behavior:'smooth',block:'start'}),40); break;
    case 'w-cambiar': W.codigo=null; vistaNueva(); break;
    case 'w-reset': if(await confirmar({titulo:'Empezar de nuevo',texto:'Se borra lo que llevas de esta acta.',ok:'Empezar de nuevo'})){ W=null; vistaNueva(); } break;
    case 'w-kit': { const p=S.personas[W.codigo]; W.items=itemsParaCargo(p.cargo); $('#w-grid').innerHTML=gridHTML(); actualizarTotales(); toast('Kit del cargo cargado'); break; }
    case 'w-todo': W.items.forEach(i=>i.fis=i.req); $('#w-grid').innerHTML=gridHTML(); actualizarTotales(); break;
    case 'w-cero': W.items.forEach(i=>i.fis=0); $('#w-grid').innerHTML=gridHTML(); actualizarTotales(); break;
    case 'w-preview': { const a=actaDesdeWizard(siguienteId()); modalDocs(a); break; }
    case 'w-enviar': enviarActa(); break;
    case 'ct': CT=el.dataset.t; vistaConfig(); break;
    case 'kit-cargo': KC=el.dataset.k; cfgKits(); break;
    case 'kit-uno': { S.kits[KC]={}; for(const i of S.catalogo) S.kits[KC][i.id]=1; guardar(); cfgKits(); break; }
    case 'kit-cero': { S.kits[KC]={}; guardar(); cfgKits(); break; }
    case 'cat-add': { const it={id:'h'+idCorto(),nombre:'NUEVA HERRAMIENTA',valor:0,valorConfirmado:false,pideMarca:false,activo:true}; S.catalogo.push(it); guardar(); cfgHerr(); const r=$(`.cat-row[data-id="${it.id}"] .cat-name`); if(r){ r.focus(); r.select(); } break; }
    case 'cat-del': { const row=el.closest('.cat-row'), it=S.catalogo.find(x=>x.id===row.dataset.id); if(await confirmar({titulo:'Quitar herramienta',texto:`Se quita <b>${esc(it.nombre)}</b> del listado y de los kits. Las actas ya enviadas no cambian.`,ok:'Quitar',peligro:true})){ S.catalogo=S.catalogo.filter(x=>x.id!==it.id); for(const k of Object.keys(S.kits)) delete S.kits[k][it.id]; guardar(); cfgHerr(); } break; }
    case 'cat-up': case 'cat-down': { const row=el.closest('.cat-row'); const i=S.catalogo.findIndex(x=>x.id===row.dataset.id); const j=act==='cat-up'?i-1:i+1; if(j<0||j>=S.catalogo.length) break; [S.catalogo[i],S.catalogo[j]]=[S.catalogo[j],S.catalogo[i]]; guardar(); cfgHerr(); break; }
    case 'cat-conf-all': S.catalogo.forEach(i=>i.valorConfirmado=true); guardar(); cfgHerr(); toast('Valores marcados como confirmados'); break;
    case 'logo-reset': S.config.logos[el.dataset.l]=null; guardar(); cfgDatos(); break;
    case 'backup': guardarArchivo(new Blob([JSON.stringify(S)],{type:'application/json'}),`Respaldo_actas_herramientas_${hoyISO()}.json`); break;
    case 'reset-demo': if(await confirmar({titulo:'Volver a los datos de ejemplo',texto:'Se borran los funcionarios y las actas de este navegador y se cargan los datos ficticios.',ok:'Volver al ejemplo',peligro:true})){ const u=S.usuario; S=await sembrarDemo(); S.usuario=u; guardar(); W=null; shell(); irA('panel'); } break;
    case 'reset-all': if(await confirmar({titulo:'Borrar todo',texto:'Se borran los funcionarios, las actas, el listado y los ajustes de este navegador. No se puede deshacer.',ok:'Borrar todo',peligro:true})){ S=estadoBase(); guardar(); W=null; shell(); irA('panel'); } break;
    case 'f-ver': { const a=actaPorToken(FS.tok); if(a) modalDocs(a,el.dataset.t==='aut'?'aut':'entrega'); break; }
    case 'f-borrar': if(FS.pad){ FS.pad.clear(); } break;
    case 'f-novedad': modalNovedad(); break;
    case 'f-pdf': { const a=actaPorToken(FS.tok); if(a) descargarPDF(a); break; }
  }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(!modal.hidden) cerrarModal(); else if(DR.id) cerrarDrawer(); } });
window.addEventListener('resize',()=>{ if(!modal.hidden) ajustarHojas(); });
window.addEventListener('storage',e=>{
  if(e.key!==KEY||FS) return; const s=cargar(); if(!s) return;
  const antes=Object.fromEntries(Object.values(S.actas).map(a=>[a.id,a.estado]));
  S=s;
  for(const a of Object.values(S.actas)){ if(antes[a.id]&&antes[a.id]!==a.estado){ if(a.estado==='firmada') toast(`${a.id}: ${titleCase(a.persona.nombre)} firmó las actas`); else if(a.estado==='novedad') toast(`${a.id}: ${titleCase(a.persona.nombre)} reportó una novedad`); } }
  if(actual==='panel') vistaPanel(); else if(actual==='funcionarios') pintarListaFunc();
  if(DR.id) pintarDrawer();
});

/* ================= Inicio ================= */
async function iniciar(){
  S=cargar();
  if(!S){ S=await sembrarDemo(); try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
  const q=new URLSearchParams(location.search), tok=q.get('firmar');
  if(tok){ appFirma(tok,q.get('demo')==='1'); return; }
  shell(); window.addEventListener('hashchange',route); route();
}
iniciar();
})();
</script>
